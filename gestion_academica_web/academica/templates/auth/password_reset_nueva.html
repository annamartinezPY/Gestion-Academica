<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nueva contraseña</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { background: linear-gradient(135deg, #0f172a 0%, #19306e 100%); min-height: 100vh; }
    .card { border: none; border-radius: 1rem; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
    .btn-save {
      background: linear-gradient(135deg, #008712, #00a81a);
      border: none; color: #fff; font-weight: 700;
    }
    .btn-save:hover { opacity: .9; color: #fff; }
    .strength-bar { height: 4px; border-radius: 4px; transition: all .2s; }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center p-3">

<div style="width:100%;max-width:420px">
  <div class="text-center mb-4">
    <i class="bi bi-shield-lock-fill" style="font-size:2.5rem;color:#a8dc9b"></i>
    <h5 class="text-white fw-bold mt-2 mb-0">Nueva contraseña</h5>
    <small class="text-white-50">Ingresá tu nueva contraseña</small>
  </div>

  <div class="card p-4">

    {% for msg in messages %}
    <div class="alert alert-{{ msg.tags|default:'info' }} alert-dismissible fade show py-2 px-3 mb-3"
         style="font-size:.875rem;border-radius:.5rem">
      {% if msg.tags == 'error' %}<i class="bi bi-x-circle-fill me-1 text-danger"></i>{% endif %}
      {{ msg }}
      <button type="button" class="btn-close btn-sm" data-bs-dismiss="alert"></button>
    </div>
    {% endfor %}

    <form method="post">
      {% csrf_token %}

      <div class="mb-3">
        <label class="form-label fw-semibold small">Nueva contraseña</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0">
            <i class="bi bi-lock" style="color:#572364"></i>
          </span>
          <input type="password" name="password" id="pwdInput"
                 class="form-control border-start-0 border-end-0"
                 placeholder="Mínimo 6 caracteres" required minlength="6" autofocus
                 oninput="calcStrength(this.value)">
          <button type="button" class="input-group-text bg-light" onclick="togglePwd('pwdInput', this)">
            <i class="bi bi-eye"></i>
          </button>
        </div>
        <!-- barra de fortaleza -->
        <div class="mt-1 px-1">
          <div class="strength-bar bg-secondary" id="strengthBar" style="width:0%"></div>
          <small class="text-muted" id="strengthLabel"></small>
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label fw-semibold small">Confirmar contraseña</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0">
            <i class="bi bi-lock-fill" style="color:#572364"></i>
          </span>
          <input type="password" name="password_confirm" id="pwdConfirm"
                 class="form-control border-start-0 border-end-0"
                 placeholder="Repetí la contraseña" required>
          <button type="button" class="input-group-text bg-light" onclick="togglePwd('pwdConfirm', this)">
            <i class="bi bi-eye"></i>
          </button>
        </div>
        <div id="matchMsg" class="small mt-1"></div>
      </div>

      <button type="submit" class="btn btn-save w-100 py-2">
        <i class="bi bi-check-lg me-2"></i>Guardar nueva contraseña
      </button>
    </form>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
function togglePwd(id, btn) {
  const input = document.getElementById(id);
  const isText = input.type === 'text';
  input.type = isText ? 'password' : 'text';
  btn.querySelector('i').className = isText ? 'bi bi-eye' : 'bi bi-eye-slash';
}

function calcStrength(val) {
  const bar = document.getElementById('strengthBar');
  const lbl = document.getElementById('strengthLabel');
  if (!val) { bar.style.width = '0%'; lbl.textContent = ''; return; }
  let score = 0;
  if (val.length >= 6)  score++;
  if (val.length >= 10) score++;
  if (/[A-Z]/.test(val)) score++;
  if (/[0-9]/.test(val)) score++;
  if (/[^A-Za-z0-9]/.test(val)) score++;
  const levels = [
    {w:'20%', cls:'bg-danger',  txt:'Muy débil'},
    {w:'40%', cls:'bg-warning', txt:'Débil'},
    {w:'60%', cls:'bg-info',    txt:'Regular'},
    {w:'80%', cls:'bg-primary', txt:'Buena'},
    {w:'100%',cls:'bg-success', txt:'Muy fuerte'},
  ];
  const lv = levels[Math.min(score - 1, 4)] || levels[0];
  bar.style.width = lv.w;
  bar.className = `strength-bar ${lv.cls}`;
  lbl.textContent = lv.txt;
}

document.getElementById('pwdConfirm').addEventListener('input', function() {
  const msg = document.getElementById('matchMsg');
  const match = this.value === document.getElementById('pwdInput').value;
  msg.innerHTML = this.value
    ? (match
        ? '<i class="bi bi-check-circle-fill text-success me-1"></i><span class="text-success">Las contraseñas coinciden</span>'
        : '<i class="bi bi-x-circle-fill text-danger me-1"></i><span class="text-danger">Las contraseñas no coinciden</span>')
    : '';
});
</script>
</body>
</html>
